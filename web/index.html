<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>印旛沼流域 GIS解析マップ</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 1;
    background: white; padding: 10px 14px; border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-size: 13px; max-width: 320px;
    max-height: 90vh; overflow-y: auto;
  }
  #panel label { display: block; margin-top: 6px; }
  #panel section { margin-top: 14px; padding-top: 10px; border-top: 1px solid #eee; }
  #panel section:first-of-type { margin-top: 10px; border-top: none; padding-top: 0; }
  #panel h2 { font-size: 12px; margin: 0 0 6px; color: #555; }
  #panel .note { font-size: 11px; color: #888; margin: 4px 0 0; }
  #raster-results table { border-collapse: collapse; width: 100%; margin-top: 6px; }
  #raster-results th, #raster-results td { border: 1px solid #ddd; padding: 3px 6px; text-align: right; }
  #raster-results th:first-child, #raster-results td:first-child { text-align: left; }
  #legend { margin-top: 8px; font-size: 12px; }
  .bar { height: 10px; background: linear-gradient(to right, #fff5eb, #7f2704); border-radius: 2px; }
  .labels { display: flex; justify-content: space-between; margin-top: 2px; }
  .categorical-legend { margin-top: 4px; font-size: 11px; max-height: 140px; overflow-y: auto; }
  .categorical-legend .swatch-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .categorical-legend .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  #extra-vectors-panel label { margin-top: 4px; }
  #extra-vectors-details summary { font-size: 12px; margin-top: 4px; }
  #results-panel {
    display: none;
    position: absolute; top: 12px; right: 12px; z-index: 1;
    background: white; padding: 10px 14px; border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-size: 13px; max-width: 320px;
    max-height: 90vh; overflow-y: auto;
  }
  #results-panel-header { display: flex; justify-content: space-between; align-items: center; }
  #results-panel-close {
    border: none; background: none; cursor: pointer; font-size: 16px; line-height: 1;
    color: #888; padding: 0 0 0 10px;
  }
  #results-panel-close:hover { color: #333; }
</style>
</head>
<body>
<div id="panel">
  <strong>印旛沼流域 GIS解析マップ</strong>

  <section>
    <h2>① 表示するレイヤー</h2>
    <label>
      ベースマップ:
      <select id="base-layer-select"></select>
    </label>
    <label>
      <input type="checkbox" id="toggle-mesh" checked />
      500mメッシュ（千葉県）を表示
    </label>
    <label style="margin-left: 18px;">
      色分け項目:
      <select id="mesh-score-select"></select>
    </label>
    <label style="margin-left: 18px;">
      透過度: <span id="mesh-opacity-value">0.6</span>
      <input type="range" id="mesh-opacity" min="0" max="1" step="0.05" value="0.6" />
    </label>
    <div id="legend">
      <div class="bar"></div>
      <div class="labels" id="legend-labels"><span>低い</span><span>高い</span></div>
    </div>
    <label style="margin-top: 10px;">
      <input type="checkbox" id="toggle-infiltration" />
      雨水浸透機能（千葉県）を表示
    </label>
    <label style="margin-left: 18px;">
      透過度: <span id="infiltration-opacity-value">0.5</span>
      <input type="range" id="infiltration-opacity" min="0" max="1" step="0.05" value="0.5" />
    </label>
    <div id="infiltration-legend" class="categorical-legend"></div>
    <details id="extra-vectors-details" style="margin-top: 10px;">
      <summary style="cursor: pointer; color: #555;">その他のベクタレイヤー</summary>
      <div id="extra-vectors-panel" style="margin-top: 6px;"></div>
    </details>
  </section>

  <section>
    <h2>② ラスタの表示</h2>
    <label>
      表示するラスタ:
      <select id="raster-overlay-select"><option value="">なし</option></select>
    </label>
    <label style="margin-left: 18px;">
      透過度: <span id="raster-overlay-opacity-value">0.8</span>
      <input type="range" id="raster-overlay-opacity" min="0" max="1" step="0.05" value="0.8" />
    </label>
    <div id="raster-overlay-legend" class="categorical-legend"></div>
  </section>

  <section>
    <h2>③ 範囲の分析</h2>
    <label>
      <input type="radio" name="analysis-mode" id="mode-buffer" value="buffer" checked />
      クリックしてバッファ範囲を分析
    </label>
    <label style="margin-left: 18px;">
      バッファ半径 (m):
      <input type="number" id="radius" value="300" min="50" max="3000" step="50" />
    </label>
    <label>
      <input type="radio" name="analysis-mode" id="mode-draw" value="draw" />
      ポリゴンを描いて分析
    </label>
    <div id="draw-controls" style="display: none; margin-left: 18px;">
      <p class="note" style="margin: 4px 0;">地図上を順にクリックして頂点を打ち、
      「この範囲で計算」を押すと確定します（3点以上必要）。</p>
      <button type="button" id="draw-undo">1つ戻す</button>
      <button type="button" id="draw-clear">クリア</button>
      <button type="button" id="draw-finish">この範囲で計算</button>
    </div>
    <p class="note">結果の「平均」は集計セルの合計(sum)を集計セル数(count)で
    割った値で、比率として扱いたい場合の「割合」と同じ値です。カテゴリカルな
    ラスタ(土地被覆区分など)は区分ごとの集計セル数を表示します。計算結果は
    右側に表示されます。</p>
    <button type="button" id="analysis-area-clear">分析範囲を消す</button>
  </section>

</div>
<div id="results-panel">
  <div id="results-panel-header">
    <strong>分析結果</strong>
    <button type="button" id="results-panel-close" aria-label="閉じる">×</button>
  </div>
  <div id="raster-results"></div>
</div>
<div id="map"></div>

<script>
let rasterCatalog = [];
fetch("data/catalog.json")
  .then((res) => res.json())
  .then((json) => {
    rasterCatalog = json.rasters || [];
    const select = document.getElementById("raster-overlay-select");
    rasterCatalog.forEach((r) => {
      const option = document.createElement("option");
      option.value = r.id;
      option.textContent = r.name;
      select.appendChild(option);
    });
  })
  .catch(() => {
    console.warn("ラスタカタログ(data/catalog.json)が見つかりません。パイプライン出力をweb/data/にコピーしてください。");
  });

// 一度取得したラスタのGeoTIFFイメージをキャッシュし、クリックのたびに
// 同じファイル(数MB~十数MB)を再取得しないようにする。
const geotiffImageCache = new Map();

async function loadGeoTiffImage(rasterMeta) {
  if (geotiffImageCache.has(rasterMeta.path)) {
    return geotiffImageCache.get(rasterMeta.path);
  }
  // GitHub PagesがHTTP Rangeリクエストに対応していないため、
  // fromUrl(部分取得)ではなく全体を取得してから読み込む方式にする。
  // ラスタが数十MBを超えるようになったら、Range対応のホスティング
  // (Cloudflare R2等)への移行を検討する。
  const buffer = await fetch(`data/${rasterMeta.path}`).then((res) => {
    if (!res.ok) throw new Error(`fetch failed: ${res.status}`);
    return res.arrayBuffer();
  });
  const tiff = await GeoTIFF.fromArrayBuffer(buffer);
  const image = await tiff.getImage();
  geotiffImageCache.set(rasterMeta.path, image);
  return image;
}

// ラスタの値を0-1の位置tから色(RGB)へ変換する簡易カラーランプ
// (青→緑→黄→赤の4段階)。データの実際のmin/maxに合わせて自動的に
// スケールするため、ラスタごとに個別のdomain設定は不要。
const RASTER_OVERLAY_RAMP = [
  [0.0, [49, 54, 149]],
  [0.33, [69, 199, 142]],
  [0.66, [254, 224, 139]],
  [1.0, [215, 48, 39]],
];

function rampColor(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < RASTER_OVERLAY_RAMP.length - 1; i++) {
    const [t0, c0] = RASTER_OVERLAY_RAMP[i];
    const [t1, c1] = RASTER_OVERLAY_RAMP[i + 1];
    if (t >= t0 && t <= t1) {
      const f = t1 > t0 ? (t - t0) / (t1 - t0) : 0;
      return [
        Math.round(c0[0] + (c1[0] - c0[0]) * f),
        Math.round(c0[1] + (c1[1] - c0[1]) * f),
        Math.round(c0[2] + (c1[2] - c0[2]) * f),
      ];
    }
  }
  return RASTER_OVERLAY_RAMP[RASTER_OVERLAY_RAMP.length - 1][1];
}

// カテゴリカルなラスタ(土地被覆区分など)用の色パレット。正式な凡例ラベルが
// 判明していないため、ひとまず「クラスN」という汎用ラベルで表示する
// (公式の区分定義が分かったらCATEGORICAL_RASTER_LABELSに追記して上書きする)。
const CATEGORICAL_RASTER_PALETTE = [
  "#1f78b4", "#33a02c", "#e31a1c", "#ff7f00", "#6a3d9a",
  "#b15928", "#a6cee3", "#b2df8a", "#fb9a99", "#fdbf6f",
  "#cab2d6", "#ffff99", "#8dd3c7", "#fccde5", "#bc80bd",
];
const CATEGORICAL_RASTER_LABELS = {}; // 例: { chiba_landcover_2020: { 1: "水域", 2: "建物" } }

function categoricalRasterColor(code) {
  const idx = (Math.round(code) - 1) % CATEGORICAL_RASTER_PALETTE.length;
  if (idx < 0) return [160, 160, 160];
  const hex = CATEGORICAL_RASTER_PALETTE[idx];
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}

function categoricalRasterLabel(rasterId, code) {
  const labels = CATEGORICAL_RASTER_LABELS[rasterId];
  if (labels && labels[code]) return labels[code];
  return `クラス${code}`;
}

// ラスタ全体を読み込み、値をカラーランプ(連続値)またはカテゴリパレット
// (categorical:trueのラスタ)で着色したcanvasを作る。nodataセルは透明にする。
async function buildRasterOverlayCanvas(rasterMeta) {
  const image = await loadGeoTiffImage(rasterMeta);
  const width = image.getWidth();
  const height = image.getHeight();
  const nodata = image.getGDALNoData();
  const [band] = await image.readRasters();

  let min = Infinity, max = -Infinity;
  const presentCategories = new Set();
  for (let i = 0; i < band.length; i++) {
    const v = band[i];
    if (nodata !== null && v === nodata) continue;
    if (rasterMeta.categorical) {
      presentCategories.add(Math.round(v));
      continue;
    }
    const rv = rasterMeta.scale ? v / rasterMeta.scale : v;
    if (rv < min) min = rv;
    if (rv > max) max = rv;
  }

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  const imgData = ctx.createImageData(width, height);
  for (let i = 0; i < band.length; i++) {
    const v = band[i];
    const o = i * 4;
    if (nodata !== null && v === nodata) {
      imgData.data[o + 3] = 0;
      continue;
    }
    let r, g, b;
    if (rasterMeta.categorical) {
      [r, g, b] = categoricalRasterColor(Math.round(v));
    } else {
      const rv = rasterMeta.scale ? v / rasterMeta.scale : v;
      const t = max > min ? (rv - min) / (max - min) : 0.5;
      [r, g, b] = rampColor(t);
    }
    imgData.data[o] = r;
    imgData.data[o + 1] = g;
    imgData.data[o + 2] = b;
    imgData.data[o + 3] = 200;
  }
  ctx.putImageData(imgData, 0, 0);
  return { canvas, min, max, presentCategories, bbox: image.getBoundingBox() };
}

function renderRasterOverlayLegend(rasterMeta, min, max, presentCategories) {
  const el = document.getElementById("raster-overlay-legend");
  if (rasterMeta.categorical) {
    const codes = [...presentCategories].sort((a, b) => a - b);
    const rows = codes
      .map((code) => {
        const [r, g, b] = categoricalRasterColor(code);
        return `<div class="swatch-row"><span class="swatch" style="background:rgb(${r},${g},${b})"></span>${categoricalRasterLabel(rasterMeta.id, code)}</div>`;
      })
      .join("");
    el.innerHTML = `<div style="margin-top:4px;">${rasterMeta.name}</div>${rows}`;
    return;
  }
  const gradient = RASTER_OVERLAY_RAMP.map(([, c]) => `rgb(${c[0]},${c[1]},${c[2]})`).join(", ");
  el.innerHTML = `
    <div style="margin-top:4px;">${rasterMeta.name}${rasterMeta.unit ? ` (${rasterMeta.unit})` : ""}</div>
    <div class="bar" style="background: linear-gradient(to right, ${gradient});"></div>
    <div class="labels"><span>${min.toFixed(2)}</span><span>${max.toFixed(2)}</span></div>
  `;
}

let currentRasterOverlayId = null;

// 選択されたラスタをMapLibreの"image"ソースとして地図に重ねる。
// ベースマップ切り替え(setStyle)でソースが消えるため、addDataLayers()の
// 中からも再度呼び出す。
async function setRasterOverlay(rasterId) {
  if (map.getLayer("raster-overlay-layer")) map.removeLayer("raster-overlay-layer");
  if (map.getSource("raster-overlay")) map.removeSource("raster-overlay");

  if (!rasterId) {
    document.getElementById("raster-overlay-legend").innerHTML = "";
    return;
  }

  const rasterMeta = rasterCatalog.find((r) => r.id === rasterId);
  if (!rasterMeta) return;

  document.getElementById("raster-overlay-legend").textContent = "読み込み中...";
  try {
    const { canvas, min, max, presentCategories, bbox } = await buildRasterOverlayCanvas(rasterMeta);
    const coordinates = [
      [bbox[0], bbox[3]],
      [bbox[2], bbox[3]],
      [bbox[2], bbox[1]],
      [bbox[0], bbox[1]],
    ];
    map.addSource("raster-overlay", { type: "image", url: canvas.toDataURL(), coordinates });
    map.addLayer({
      id: "raster-overlay-layer",
      type: "raster",
      source: "raster-overlay",
      paint: { "raster-opacity": Number(document.getElementById("raster-overlay-opacity").value) },
    });
    renderRasterOverlayLegend(rasterMeta, min, max, presentCategories);
  } catch (err) {
    document.getElementById("raster-overlay-legend").textContent = `読み込みエラー: ${err.message}`;
  }
}

document.getElementById("raster-overlay-select").addEventListener("change", (e) => {
  currentRasterOverlayId = e.target.value || null;
  setRasterOverlay(currentRasterOverlayId);
});

document.getElementById("raster-overlay-opacity").addEventListener("input", (e) => {
  document.getElementById("raster-overlay-opacity-value").textContent = e.target.value;
  if (map.getLayer("raster-overlay-layer")) {
    map.setPaintProperty("raster-overlay-layer", "raster-opacity", Number(e.target.value));
  }
});

// 指定ポリゴン内の1ラスタの統計値を計算する。categorical:trueのラスタは
// 区分ごとの集計セル数(histogram)を、それ以外は平均・最小・最大・集計セル数を返す。
async function computeRasterBufferStats(rasterMeta, bufferPolygon, bufferBbox) {
  const image = await loadGeoTiffImage(rasterMeta);

  const imgBbox = image.getBoundingBox(); // [minX, minY, maxX, maxY]
  const width = image.getWidth();
  const height = image.getHeight();
  const pixelWidth = (imgBbox[2] - imgBbox[0]) / width;
  const pixelHeight = (imgBbox[3] - imgBbox[1]) / height;
  const nodata = image.getGDALNoData();

  let x0 = Math.floor((bufferBbox[0] - imgBbox[0]) / pixelWidth);
  let x1 = Math.ceil((bufferBbox[2] - imgBbox[0]) / pixelWidth);
  let y0 = Math.floor((imgBbox[3] - bufferBbox[3]) / pixelHeight);
  let y1 = Math.ceil((imgBbox[3] - bufferBbox[1]) / pixelHeight);

  x0 = Math.max(0, x0);
  y0 = Math.max(0, y0);
  x1 = Math.min(width, x1);
  y1 = Math.min(height, y1);

  if (x1 <= x0 || y1 <= y0) {
    return { ...rasterMeta, outOfExtent: true };
  }

  const data = await image.readRasters({ window: [x0, y0, x1, y1] });
  const band = data[0];
  const winWidth = x1 - x0;

  if (rasterMeta.categorical) {
    const histogram = {};
    let count = 0;
    for (let row = 0; row < y1 - y0; row++) {
      for (let col = 0; col < winWidth; col++) {
        const value = band[row * winWidth + col];
        if (nodata !== null && value === nodata) continue;

        const lonC = imgBbox[0] + (x0 + col + 0.5) * pixelWidth;
        const latC = imgBbox[3] - (y0 + row + 0.5) * pixelHeight;
        if (!turf.booleanPointInPolygon([lonC, latC], bufferPolygon)) continue;

        const code = Math.round(value);
        histogram[code] = (histogram[code] || 0) + 1;
        count += 1;
      }
    }
    if (count === 0) return { ...rasterMeta, count: 0 };
    return { ...rasterMeta, categorical: true, histogram, count };
  }

  let sum = 0, count = 0, min = Infinity, max = -Infinity;
  for (let row = 0; row < y1 - y0; row++) {
    for (let col = 0; col < winWidth; col++) {
      const value = band[row * winWidth + col];
      if (nodata !== null && value === nodata) continue;

      const lonC = imgBbox[0] + (x0 + col + 0.5) * pixelWidth;
      const latC = imgBbox[3] - (y0 + row + 0.5) * pixelHeight;
      if (!turf.booleanPointInPolygon([lonC, latC], bufferPolygon)) continue;

      // scaleが指定されている場合は保存時にscale倍されているので割り戻す
      const realValue = rasterMeta.scale ? value / rasterMeta.scale : value;

      sum += realValue;
      count += 1;
      if (realValue < min) min = realValue;
      if (realValue > max) max = realValue;
    }
  }

  if (count === 0) return { ...rasterMeta, count: 0 };
  return { ...rasterMeta, count, sum, mean: sum / count, min, max };
}

// 任意のポリゴン(バッファ円・手描きポリゴンいずれも可)に対して
// 全ラスタの統計値を計算し、結果テーブルを描画する。
async function calcStatsForAllRastersInPolygon(polygon) {
  showAnalysisArea(polygon);
  document.getElementById("results-panel").style.display = "block";
  const bbox = turf.bbox(polygon);

  const resultsEl = document.getElementById("raster-results");
  if (rasterCatalog.length === 0) {
    resultsEl.textContent = "ラスタカタログが未取得です。";
    return;
  }
  resultsEl.textContent = "計算中...";

  const results = await Promise.all(
    rasterCatalog.map((r) => computeRasterBufferStats(r, polygon, bbox).catch((err) => ({ ...r, error: err.message })))
  );

  let html = "<table><tr><th>ラスタ（単位）</th><th>平均/割合・区分</th><th>最小</th><th>最大</th><th>集計セル数</th></tr>";
  results.forEach((r) => {
    const label = r.unit ? `${r.name}<br><span style="color:#888;font-weight:normal;">(${r.unit})</span>` : r.name;
    if (r.error) {
      html += `<tr><td>${label}</td><td colspan="4">エラー: ${r.error}</td></tr>`;
    } else if (r.outOfExtent || r.count === 0) {
      html += `<tr><td>${label}</td><td colspan="4">指定範囲がデータ範囲外です</td></tr>`;
    } else if (r.categorical) {
      const breakdown = Object.entries(r.histogram)
        .sort((a, b) => b[1] - a[1])
        .map(([code, cnt]) => `${categoricalRasterLabel(r.id, code)}: ${cnt}件 (${((cnt / r.count) * 100).toFixed(0)}%)`)
        .join("<br>");
      html += `<tr><td>${label}</td><td colspan="3">${breakdown}</td><td>${r.count}</td></tr>`;
    } else {
      html += `<tr><td>${label}</td><td>${r.mean.toFixed(2)}</td><td>${r.min.toFixed(2)}</td><td>${r.max.toFixed(2)}</td><td>${r.count}</td></tr>`;
    }
  });
  html += "</table>";
  resultsEl.innerHTML = html;
}

function calcBufferStatsForAllRasters(lng, lat, radiusMeters) {
  const point = turf.point([lng, lat]);
  const bufferPolygon = turf.buffer(point, radiusMeters / 1000, { units: "kilometers" });
  return calcStatsForAllRastersInPolygon(bufferPolygon);
}

// ベースマップの定義。新しいタイル(旧版地形図など)を追加したいときは、
// この配列に1エントリ追加するだけでセレクタに反映される。
const BASE_LAYERS = [
  {
    id: "gsi_pale",
    name: "地理院地図(淡色)",
    tiles: ["https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png"],
    tileSize: 256,
    attribution: "地図: 国土地理院",
    maxzoom: 18,
  },
  {
    id: "gsi_std",
    name: "地理院地図(標準)",
    tiles: ["https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png"],
    tileSize: 256,
    attribution: "地図: 国土地理院",
    maxzoom: 18,
  },
  {
    id: "old_topo",
    name: "旧版地形図",
    // 関東地方(kanto)の今昔マップ。印旛沼流域が対象のため同じデータセットを使用。
    tiles: ["https://ktgis.net/kjmapw/kjtilemap/kanto/00/{z}/{x}/{y}.png"],
    scheme: "tms",
    tileSize: 256,
    attribution: "地図：旧版地形図1894年",
    maxzoom: 18,
  },
];

function baseLayerStyleSpec(layer) {
  return {
    version: 8,
    sources: {
      [layer.id]: {
        type: "raster",
        tiles: layer.tiles,
        tileSize: layer.tileSize || 256,
        scheme: layer.scheme || "xyz",
        attribution: layer.attribution || "",
      },
    },
    layers: [{ id: layer.id, type: "raster", source: layer.id }],
  };
}

const defaultBaseLayer = BASE_LAYERS.find((l) => l.tiles) || BASE_LAYERS[0];

const map = new maplibregl.Map({
  container: "map",
  style: baseLayerStyleSpec(defaultBaseLayer),
  center: [140.33, 35.76],
  zoom: 11,
});

// ベースマップ切り替えセレクタの初期化
const baseLayerSelect = document.getElementById("base-layer-select");
BASE_LAYERS.forEach((layer) => {
  const option = document.createElement("option");
  option.value = layer.id;
  option.textContent = layer.name + (layer.tiles ? "" : "（URL未設定）");
  option.disabled = !layer.tiles;
  if (layer.id === defaultBaseLayer.id) option.selected = true;
  baseLayerSelect.appendChild(option);
});
baseLayerSelect.addEventListener("change", (e) => {
  const layer = BASE_LAYERS.find((l) => l.id === e.target.value);
  if (!layer || !layer.tiles) return;
  map.setStyle(baseLayerStyleSpec(layer));
  // "style.load"はこの構成(スプライト等を持たない軽量なスタイル)だと
  // 発火しないことがあるため、新スタイルの読み込み・タイル取得が
  // 落ち着いたことを示す"idle"を使ってレイヤーを再構築する。
  map.once("idle", () => addDataLayers());
});

map.on("error", (e) => {
  console.error("MapLibre error:", e && e.error ? e.error : e);
});

let dataLayerListenersAttached = false;

// ポリゴン描画モード(範囲を自分で描いてラスタを分析する機能)の状態。
let drawModeActive = false;
let drawPoints = [];

function drawPreviewGeoJSON() {
  const features = drawPoints.map((pt) => ({
    type: "Feature",
    geometry: { type: "Point", coordinates: pt },
    properties: {},
  }));
  if (drawPoints.length >= 2) {
    const lineCoords = drawPoints.length >= 3 ? [...drawPoints, drawPoints[0]] : drawPoints;
    features.push({ type: "Feature", geometry: { type: "LineString", coordinates: lineCoords }, properties: {} });
  }
  if (drawPoints.length >= 3) {
    features.push({
      type: "Feature",
      geometry: { type: "Polygon", coordinates: [[...drawPoints, drawPoints[0]]] },
      properties: {},
    });
  }
  return { type: "FeatureCollection", features };
}

// setStyle()でスタイルを切り替えるとソース/レイヤーが全て消えるため、
// addDataLayers()の中から毎回呼び、まだ無ければ作る。
function addDrawPreviewLayer() {
  if (map.getSource("draw-preview")) return;
  map.addSource("draw-preview", { type: "geojson", data: drawPreviewGeoJSON() });
  map.addLayer({
    id: "draw-preview-fill",
    type: "fill",
    source: "draw-preview",
    filter: ["==", ["geometry-type"], "Polygon"],
    paint: { "fill-color": "#ff7f00", "fill-opacity": 0.2 },
  });
  map.addLayer({
    id: "draw-preview-line",
    type: "line",
    source: "draw-preview",
    filter: ["==", ["geometry-type"], "LineString"],
    paint: { "line-color": "#ff7f00", "line-width": 2, "line-dasharray": [2, 1] },
  });
  map.addLayer({
    id: "draw-preview-points",
    type: "circle",
    source: "draw-preview",
    filter: ["==", ["geometry-type"], "Point"],
    paint: { "circle-radius": 4, "circle-color": "#ff7f00" },
  });
}

function updateDrawPreview() {
  const src = map.getSource("draw-preview");
  if (src) src.setData(drawPreviewGeoJSON());
}

function clearDrawPoints() {
  drawPoints = [];
  updateDrawPreview();
}

// 実際に集計対象になった範囲(バッファ円 or 確定したポリゴン)を
// 地図上に表示しておくためのレイヤー。draw-previewとは別に持ち、
// 「計算中の下書き」と「確定して計算に使った範囲」を区別する。
function addAnalysisAreaLayer() {
  if (map.getSource("analysis-area")) return;
  map.addSource("analysis-area", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "analysis-area-fill",
    type: "fill",
    source: "analysis-area",
    paint: { "fill-color": "#1e88e5", "fill-opacity": 0.15 },
  });
  map.addLayer({
    id: "analysis-area-line",
    type: "line",
    source: "analysis-area",
    paint: { "line-color": "#1e88e5", "line-width": 2 },
  });
}

function showAnalysisArea(polygon) {
  const src = map.getSource("analysis-area");
  if (src) src.setData({ type: "FeatureCollection", features: [polygon] });
}

function clearAnalysisArea() {
  const src = map.getSource("analysis-area");
  if (src) src.setData({ type: "FeatureCollection", features: [] });
  clearDrawPoints();
  document.getElementById("raster-results").innerHTML = "";
  document.getElementById("results-panel").style.display = "none";
}

document.getElementById("results-panel-close").addEventListener("click", clearAnalysisArea);

document.querySelectorAll('input[name="analysis-mode"]').forEach((radio) => {
  radio.addEventListener("change", () => {
    drawModeActive = document.getElementById("mode-draw").checked;
    document.getElementById("draw-controls").style.display = drawModeActive ? "block" : "none";
    clearDrawPoints();
  });
});

document.getElementById("draw-undo").addEventListener("click", () => {
  drawPoints.pop();
  updateDrawPreview();
});

document.getElementById("draw-clear").addEventListener("click", clearDrawPoints);

document.getElementById("draw-finish").addEventListener("click", () => {
  if (drawPoints.length < 3) {
    alert("ポリゴンには3点以上の頂点が必要です。");
    return;
  }
  const ring = [...drawPoints, drawPoints[0]];
  calcStatsForAllRastersInPolygon(turf.polygon([ring]));
  // 確定後はanalysis-areaレイヤーが同じ範囲を表示するので、下書きの
  // 頂点/線は消しておく(二重に表示されるのを防ぐ)。
  clearDrawPoints();
});

document.getElementById("analysis-area-clear").addEventListener("click", clearAnalysisArea);

// メッシュの色分け対象スコアの定義(500mメッシュGI統合データの属性名と一致)。
const MESH_SCORES = {
  priority_rank: {
    label: "優先度ランク",
    domain: [1, 3, 5],
    colors: ["#edf8e9", "#74c476", "#005a32"],
    legendLow: "低い",
    legendHigh: "高い",
  },
  gi_conservation_score: {
    label: "GI保全スコア",
    domain: [0, 0.1, 0.3],
    colors: ["#fff5eb", "#e6550d", "#7f2704"],
    legendLow: "低い",
    legendHigh: "高い",
  },
  gi_pressure_score: {
    label: "GI開発圧スコア",
    domain: [0, 0.2, 0.5],
    colors: ["#f2f0f7", "#9e77c8", "#54278f"],
    legendLow: "低い",
    legendHigh: "高い",
  },
  urban_frac: {
    label: "市街地率",
    domain: [0, 0.5, 1],
    colors: ["#f7f7f7", "#969696", "#252525"],
    legendLow: "低い",
    legendHigh: "高い",
  },
  forest_frac: {
    label: "森林率",
    domain: [0, 0.5, 1],
    colors: ["#f7fcf5", "#74c476", "#00441b"],
    legendLow: "低い",
    legendHigh: "高い",
  },
};

let currentMeshScore = "priority_rank";

// 雨水浸透機能レイヤーのカテゴリ("result"列の値)ごとの色・凡例ラベル。
// 適地/最適地を緑系、不適地を赤系、対象外・判定不能・除外はグレー系にしている。
const INFILTRATION_CATEGORIES = [
  { value: "01最適地", label: "最適地", color: "#1a9850" },
  { value: "02適地", label: "適地", color: "#91cf60" },
  { value: "03不適地", label: "不適地", color: "#d73027" },
  { value: "05判定不能（地形分類データなし）", label: "判定不能（地形分類データなし）", color: "#bdbdbd" },
  { value: "06判定対象外（山地等）", label: "判定対象外（山地等）", color: "#969696" },
  { value: "07除外区域", label: "除外区域", color: "#525252" },
];

function infiltrationFillColorExpression() {
  const expr = ["match", ["get", "result"]];
  INFILTRATION_CATEGORIES.forEach((c) => expr.push(c.value, c.color));
  expr.push("#cccccc"); // 未知の値のフォールバック
  return expr;
}

function renderInfiltrationLegend() {
  const el = document.getElementById("infiltration-legend");
  el.innerHTML = INFILTRATION_CATEGORIES.map(
    (c) => `<div class="swatch-row"><span class="swatch" style="background:${c.color}"></span>${c.label}</div>`
  ).join("");
}

function meshFillColorExpression(scoreId) {
  const cfg = MESH_SCORES[scoreId];
  return [
    "interpolate", ["linear"], ["get", scoreId],
    cfg.domain[0], cfg.colors[0],
    cfg.domain[1], cfg.colors[1],
    cfg.domain[2], cfg.colors[2],
  ];
}

function updateMeshLegend(scoreId) {
  const cfg = MESH_SCORES[scoreId];
  document.querySelector("#legend .bar").style.background =
    `linear-gradient(to right, ${cfg.colors[0]}, ${cfg.colors[1]}, ${cfg.colors[2]})`;
  document.getElementById("legend-labels").innerHTML =
    `<span>${cfg.legendLow}</span><span>${cfg.legendHigh}</span>`;
}

function setMeshScore(scoreId) {
  currentMeshScore = scoreId;
  if (map.getLayer("chiba-mesh-fill")) {
    map.setPaintProperty("chiba-mesh-fill", "fill-color", meshFillColorExpression(scoreId));
  }
  updateMeshLegend(scoreId);
}

// ①・②(メッシュ/境界/雨水浸透)で特別扱いするベクタID。これ以外の
// vectors_catalog.jsonのエントリは、汎用レイヤーとして④に自動追加される。
const SPECIAL_VECTOR_IDS = new Set(["chiba_boundary_approx", "chiba_mesh500m_gi", "chiba_infiltration_potential"]);
const EXTRA_VECTOR_PALETTE = ["#1f78b4", "#33a02c", "#e31a1c", "#ff7f00", "#6a3d9a", "#b15928", "#a6cee3", "#b2df8a"];
const extraVectorControlsBuilt = new Set();

// 16進カラーをamount(0-1)だけ白に近づけた薄い色を作る(色分けの低い側に使う)。
function lightenColor(hex, amount) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const lr = Math.round(r + (255 - r) * amount);
  const lg = Math.round(g + (255 - g) * amount);
  const lb = Math.round(b + (255 - b) * amount);
  return `rgb(${lr},${lg},${lb})`;
}

function renderExtraVectorLegend(vectorMeta, min, max, lightColor, darkColor) {
  const el = document.getElementById(`${vectorMeta.id}-legend`);
  if (!el) return;
  el.innerHTML = `
    <div class="bar" style="background: linear-gradient(to right, ${lightColor}, ${darkColor});"></div>
    <div class="labels"><span>${min.toFixed(1)}</span><span>${max.toFixed(1)}</span></div>
  `;
}

// mesh/boundary/infiltration以外のベクタ(ESV系データなど)を、専用コードを
// 書かずに汎用的な表示切替・透過度調整・プロパティポップアップ付きで
// 追加する。新しいベクタをVECTOR_DEFSに追加するだけで、ここに自動で現れる。
// vectors_catalog.jsonで"color_field"が指定されている場合は、その属性値の
// 実際のmin/maxに合わせた濃淡の色分け(+凡例)にする。未指定の場合は単色塗り。
async function addExtraVectorLayer(vectorMeta, index) {
  const sourceId = `extra-src-${vectorMeta.id}`;
  const fillId = `extra-fill-${vectorMeta.id}`;
  const lineId = `extra-line-${vectorMeta.id}`;
  const color = EXTRA_VECTOR_PALETTE[index % EXTRA_VECTOR_PALETTE.length];

  if (!extraVectorControlsBuilt.has(vectorMeta.id)) {
    const container = document.getElementById("extra-vectors-panel");
    const row = document.createElement("div");
    row.innerHTML = `
      <label>
        <input type="checkbox" id="toggle-${vectorMeta.id}" />
        ${vectorMeta.name}
      </label>
      <label style="margin-left: 18px;">
        透過度: <span id="${vectorMeta.id}-opacity-value">0.5</span>
        <input type="range" id="${vectorMeta.id}-opacity" min="0" max="1" step="0.05" value="0.5" />
      </label>
      <div id="${vectorMeta.id}-legend" style="margin-left: 18px;"></div>
    `;
    container.appendChild(row);
    extraVectorControlsBuilt.add(vectorMeta.id);

    document.getElementById(`toggle-${vectorMeta.id}`).addEventListener("change", (e) => {
      const visibility = e.target.checked ? "visible" : "none";
      if (map.getLayer(fillId)) map.setLayoutProperty(fillId, "visibility", visibility);
      if (map.getLayer(lineId)) map.setLayoutProperty(lineId, "visibility", visibility);
    });
    document.getElementById(`${vectorMeta.id}-opacity`).addEventListener("input", (e) => {
      document.getElementById(`${vectorMeta.id}-opacity-value`).textContent = e.target.value;
      if (map.getLayer(fillId)) map.setPaintProperty(fillId, "fill-opacity", Number(e.target.value));
    });

    map.on("click", fillId, (e) => {
      if (drawModeActive) return;
      const p = e.features[0].properties;
      const rows = Object.entries(p).slice(0, 12).map(([k, v]) => `${k}: ${v}`).join("<br>");
      new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<strong>${vectorMeta.name}</strong><br>${rows}`).addTo(map);
    });
  }

  if (map.getSource(sourceId)) return; // 現在のスタイルに既に追加済み

  const visible = document.getElementById(`toggle-${vectorMeta.id}`).checked;

  let fillColor = color;
  if (vectorMeta.color_field) {
    try {
      const geojson = await fetch(`data/${vectorMeta.path}`).then((r) => r.json());
      let min = Infinity, max = -Infinity;
      geojson.features.forEach((f) => {
        const v = f.properties ? f.properties[vectorMeta.color_field] : undefined;
        if (typeof v === "number" && !Number.isNaN(v)) {
          if (v < min) min = v;
          if (v > max) max = v;
        }
      });
      if (min < max) {
        const light = lightenColor(color, 0.85);
        fillColor = ["interpolate", ["linear"], ["get", vectorMeta.color_field], min, light, max, color];
        renderExtraVectorLegend(vectorMeta, min, max, light, color);
      }
    } catch (err) {
      console.warn(`色分け用データの取得に失敗しました(単色塗りにフォールバック): ${vectorMeta.id}`, err);
    }
  }

  map.addSource(sourceId, { type: "geojson", data: `data/${vectorMeta.path}` });
  map.addLayer({
    id: fillId,
    type: "fill",
    source: sourceId,
    layout: { visibility: visible ? "visible" : "none" },
    paint: { "fill-color": fillColor, "fill-opacity": Number(document.getElementById(`${vectorMeta.id}-opacity`).value) },
  });
  map.addLayer({
    id: lineId,
    type: "line",
    source: sourceId,
    layout: { visibility: visible ? "visible" : "none" },
    paint: { "line-color": color, "line-width": 1 },
  });
}

async function addDataLayers() {
  try {
    const vectorsCatalog = await fetch("data/vectors_catalog.json").then((r) => r.json());
    const vectors = vectorsCatalog.vectors || [];

    const mesh = vectors.find((v) => v.id === "chiba_mesh500m_gi");
    if (mesh) {
      map.addSource("chiba-mesh", { type: "geojson", data: `data/${mesh.path}` });
      map.addLayer({
        id: "chiba-mesh-fill",
        type: "fill",
        source: "chiba-mesh",
        paint: {
          "fill-color": meshFillColorExpression(currentMeshScore),
          "fill-opacity": Number(document.getElementById("mesh-opacity").value),
        },
      });
      map.addLayer({
        id: "chiba-mesh-outline",
        type: "line",
        source: "chiba-mesh",
        paint: { "line-color": "#999", "line-width": 0.3 },
      });
      updateMeshLegend(currentMeshScore);

      if (!dataLayerListenersAttached) {
        map.on("click", "chiba-mesh-fill", (e) => {
          if (drawModeActive) return;
          const p = e.features[0].properties;
          new maplibregl.Popup()
            .setLngLat(e.lngLat)
            .setHTML(
              `<strong>メッシュ ${p.mesh4_code}</strong><br>
               GI保全スコア: ${Number(p.gi_conservation_score).toFixed(2)}<br>
               GI開発圧スコア: ${Number(p.gi_pressure_score).toFixed(2)}<br>
               優先度ランク: ${p.priority_rank}<br>
               市街地率: ${Number(p.urban_frac).toFixed(2)} / 森林率: ${Number(p.forest_frac).toFixed(2)}<br>
               浸透適地率: ${p.infiltration_good_pct != null ? Number(p.infiltration_good_pct).toFixed(0) + "%" : "-"} /
               分類: ${p.dual_axis_group || "-"}`
            )
            .addTo(map);
        });

        document.getElementById("toggle-mesh").addEventListener("change", (e) => {
          const visibility = e.target.checked ? "visible" : "none";
          map.setLayoutProperty("chiba-mesh-fill", "visibility", visibility);
          map.setLayoutProperty("chiba-mesh-outline", "visibility", visibility);
        });

        const meshScoreSelect = document.getElementById("mesh-score-select");
        Object.entries(MESH_SCORES).forEach(([scoreId, cfg]) => {
          const option = document.createElement("option");
          option.value = scoreId;
          option.textContent = cfg.label;
          if (scoreId === currentMeshScore) option.selected = true;
          meshScoreSelect.appendChild(option);
        });
        meshScoreSelect.addEventListener("change", (e) => setMeshScore(e.target.value));

        const meshOpacityInput = document.getElementById("mesh-opacity");
        meshOpacityInput.addEventListener("input", (e) => {
          document.getElementById("mesh-opacity-value").textContent = e.target.value;
          if (map.getLayer("chiba-mesh-fill")) {
            map.setPaintProperty("chiba-mesh-fill", "fill-opacity", Number(e.target.value));
          }
        });
      }
    }

    const boundary = vectors.find((v) => v.id === "chiba_boundary_approx");
    if (boundary) {
      map.addSource("chiba-boundary", { type: "geojson", data: `data/${boundary.path}` });
      map.addLayer({
        id: "chiba-boundary-line",
        type: "line",
        source: "chiba-boundary",
        paint: { "line-color": "#2166ac", "line-width": 1.5 },
      });
    }

    const infiltration = vectors.find((v) => v.id === "chiba_infiltration_potential");
    if (infiltration) {
      const infiltrationVisible = document.getElementById("toggle-infiltration").checked;
      map.addSource("chiba-infiltration", { type: "geojson", data: `data/${infiltration.path}` });
      map.addLayer({
        id: "chiba-infiltration-fill",
        type: "fill",
        source: "chiba-infiltration",
        layout: { visibility: infiltrationVisible ? "visible" : "none" },
        paint: {
          "fill-color": infiltrationFillColorExpression(),
          "fill-opacity": Number(document.getElementById("infiltration-opacity").value),
        },
      });
      map.addLayer({
        id: "chiba-infiltration-outline",
        type: "line",
        source: "chiba-infiltration",
        layout: { visibility: infiltrationVisible ? "visible" : "none" },
        paint: { "line-color": "#666", "line-width": 0.2 },
      });
      renderInfiltrationLegend();

      if (!dataLayerListenersAttached) {
        map.on("click", "chiba-infiltration-fill", (e) => {
          if (drawModeActive) return;
          const p = e.features[0].properties;
          const cat = INFILTRATION_CATEGORIES.find((c) => c.value === p.result);
          new maplibregl.Popup()
            .setLngLat(e.lngLat)
            .setHTML(`<strong>雨水浸透機能</strong><br>${cat ? cat.label : p.result}`)
            .addTo(map);
        });

        document.getElementById("toggle-infiltration").addEventListener("change", (e) => {
          const visibility = e.target.checked ? "visible" : "none";
          map.setLayoutProperty("chiba-infiltration-fill", "visibility", visibility);
          map.setLayoutProperty("chiba-infiltration-outline", "visibility", visibility);
        });

        const infiltrationOpacityInput = document.getElementById("infiltration-opacity");
        infiltrationOpacityInput.addEventListener("input", (e) => {
          document.getElementById("infiltration-opacity-value").textContent = e.target.value;
          if (map.getLayer("chiba-infiltration-fill")) {
            map.setPaintProperty("chiba-infiltration-fill", "fill-opacity", Number(e.target.value));
          }
        });
      }
    }

    vectors.filter((v) => !SPECIAL_VECTOR_IDS.has(v.id)).forEach((v, i) => addExtraVectorLayer(v, i));

    addDrawPreviewLayer();
    addAnalysisAreaLayer();
  } catch (err) {
    console.warn("ベクタカタログ(data/vectors_catalog.json)の読み込みに失敗しました。", err);
  }

  if (currentRasterOverlayId) {
    setRasterOverlay(currentRasterOverlayId);
  }

  dataLayerListenersAttached = true;
}

map.on("load", () => addDataLayers());

map.on("click", (e) => {
  if (drawModeActive) {
    drawPoints.push([e.lngLat.lng, e.lngLat.lat]);
    updateDrawPreview();
    return;
  }
  const { lng, lat } = e.lngLat;
  const radiusMeters = Number(document.getElementById("radius").value) || 300;
  calcBufferStatsForAllRasters(lng, lat, radiusMeters);
});
</script>
</body>
